<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Us</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      :root {
        --custom-red: #dc2626;
      }
      textarea::-webkit-scrollbar {
        width: 8px;
      }
      textarea::-webkit-scrollbar-thumb {
        background-color: var(--custom-red);
        border-radius: 4px;
      }
      textarea::-webkit-scrollbar-track {
        background: transparent;
      }
      input::placeholder,
      textarea::placeholder {
        color: white;
        opacity: 1;
      }
    </style>
  </head>
  <body class="bg-white min-h-screen flex items-center justify-center p-4">
    <div
      class="w-full max-w-3xl bg-white rounded-lg shadow-lg p-8 sm:p-10 md:p-12"
    >
      <h2
        class="text-center font-bold text-lg sm:text-xl md:text-2xl leading-tight text-black"
      >
        Ask Anything! Contact Us
      </h2>
      <p
        class="text-center text-gray-600 text-xs sm:text-sm md:text-base mt-3 max-w-xl mx-auto leading-relaxed"
      >
        We aim to provide great customer service. For inquiries, technical
        support and price quotation, here are all the ways you can contact us.
      </p>
      <form id="contact-form" class="mt-8 space-y-6" novalidate>
        <div>
          <label
            for="name"
            class="block text-black text-sm sm:text-base font-semibold mb-1"
            >Name *</label
          >
          <input
            id="name"
            name="user_name"
            type="text"
            placeholder="Enter your name"
            required
            class="w-full bg-[var(--custom-red)] text-white text-sm sm:text-base px-4 py-3 rounded-md focus:outline-none focus:ring-2 focus:ring-red-700 transition"
          />
        </div>
        <div>
          <label
            for="email"
            class="block text-black text-sm sm:text-base font-semibold mb-1"
            >Email *</label
          >
          <input
            id="email"
            name="user_email"
            type="email"
            placeholder="Enter your email"
            required
            class="w-full bg-[var(--custom-red)] text-white text-sm sm:text-base px-4 py-3 rounded-md focus:outline-none focus:ring-2 focus:ring-red-700 transition"
          />
        </div>
        <div>
          <label
            for="phone"
            class="block text-black text-sm sm:text-base font-semibold mb-1"
            >Phone *</label
          >
          <input
            id="phone"
            name="user_phone"
            type="tel"
            placeholder="Enter your phone number"
            required
            class="w-full bg-[var(--custom-red)] text-white text-sm sm:text-base px-4 py-3 rounded-md focus:outline-none focus:ring-2 focus:ring-red-700 transition"
          />
        </div>
        <div>
          <label
            for="message"
            class="block text-black text-sm sm:text-base font-semibold mb-1"
            >Message *</label
          >
          <textarea
            id="message"
            name="message"
            rows="6"
            placeholder="Enter your message"
            required
            class="w-full bg-[var(--custom-red)] text-white text-sm sm:text-base px-4 py-3 rounded-md resize-y min-h-[140px] max-h-60 focus:outline-none focus:ring-2 focus:ring-red-700 transition"
          ></textarea>
        </div>
        <div class="flex justify-center">
          <button
            type="submit"
            class="bg-black text-white text-xs sm:text-sm font-semibold px-8 py-3 rounded-md hover:bg-gray-900 transition"
          >
            Submit
          </button>
        </div>
      </form>
    </div>

    <script>
      (function () {
        emailjs.init("OKRIvm4vuoRZPwIdt"); // Your EmailJS public key
      })();

      const form = document.getElementById("contact-form");

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        emailjs.sendForm("service_awncrm6", "template_6zpioiw", this).then(
          () => {
            Swal.fire({
              icon: "success",
              title: "Message Sent!",
              text: "We will get back to you shortly.",
              confirmButtonColor: "#dc2626",
            });
            form.reset();
          },
          (error) => {
            Swal.fire({
              icon: "error",
              title: "Failed to send",
              text: "Something went wrong. Please try again later.",
              confirmButtonColor: "#dc2626",
            });
            console.error("EmailJS error:", error);
          }
        );
      });
    </script>
  </body>
</html>
